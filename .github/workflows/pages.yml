name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # LFS 대역폭 절약: game/ 의 LFS 객체를 캐시해 바뀐 파일만 받는다
      - name: List LFS objects
        run: git lfs ls-files -l -I "game/" | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull -I "game/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
